[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xwiclassifier"
version = "0.2.0"
description = "Classification de pixels/voxels 2D/3D (alternative libre a ilastik / IPSDK Explorer), utilisable en script, en ligne de commande ou dans napari"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Emmanuel Brun" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "joblib",
    "tifffile",
    "h5py",
]

[project.optional-dependencies]
napari = ["napari[all]>=0.4.19", "qtpy"]
gpu = ["pyclesperanto"]
boosting = ["lightgbm>=4.0", "xgboost>=2.0"]
zarr = ["zarr"]
all = ["xwiclassifier[napari,boosting,zarr]"]
dev = ["pytest>=7.0", "ruff"]

[project.scripts]
xwi = "xwiclassifier.cli:main"

[project.entry-points."napari.manifest"]
xwiclassifier = "xwiclassifier.napari:napari.yaml"

[project.urls]
Repository = "https://github.com/DoctorEmmetBrown/xwiClassifier"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xwiclassifier.napari" = ["napari.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
